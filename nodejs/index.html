<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div style="width:300px; height:200px; background-color: aqua; padding: 10px; border: 10px solid red; margin: 2px;" >
           
    </div>
    <div style="width:300px; height:200px; background-color: aqua; padding: 10px; border: 10px solid red; box-sizing: border-box;" >
           
    </div> 

  <div style="width: 100%">
      <p style="display: inline">hi im Sudeep</p>
    </div>
    <div style="width: 100%">
      <p style="display: block">hi im Sudeep</p>
    </div>
    <div style="width: 100%">
      <p style="display: inline-block;">hi im Sudeep</p>
      1. INLINE (Ignores width, height, and top/bottom margins)
   <p
        style="
          display: block;
          width: 200px;
          height: 100px;
          background-color: yellow;
          margin: 30px;
        "
      >
        I am Inline
      </p>

      2. INLINE-BLOCK (Respects width, height, and top/bottom margins)
      <p
        style="
          display: inline-block;
          width: 200px;
          height: 100px;
          background-color: yellow;
          margin: 30px;
        "
      >
        I am Inline-Block
      </p>
    </div>  
    <!-- BLOCK: They will stack on top of each other -->
<div style="display: block; width: 100px; height: 100px; background-color: red; color: white;">Block 1</div>
<div style="display: block; width: 100px; height: 100px; background-color: blue; color: white;">Block 2</div>

<br><br>

<!-- INLINE-BLOCK: They will sit side-by-side -->
<div style="display: inline-block; width: 100px; height: 100px; background-color: red; color: white;">Inline-Block 1</div>
<div style="display: inline-block; width: 100px; height: 100px; background-color: blue; color: white;">Inline-Block 2</div>
  </body>
</html>
