    <style>
      @keyframes slideAndChange {
  /* 0% is the starting state */
  0% {
    transform: translateX(0);
    background-color: blue;
  }
  
  /* 50% is the halfway point */
  50% {
    transform: translateX(200px); /* Slides right */
    background-color: red;        /* Changes to red */
  }
  
  /* 100% is the end state */
  100% {
    transform: translateX(0);     /* Slides back to start */
    background-color: blue;       /* Changes back to blue */
  }
}
    </style>
